<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>現實治療 25 頁複習站</title>
<meta name="description" content="選擇理論與現實治療：理論、心智圖、個案概念化、考古題複習的互動式簡報">
<style>
:root{
  --bg:#f6f1e7; --card:#ffffff; --ink:#2b2a27; --muted:#6f6a5f; --line:#e4dccb;
  --brand:#2f5d50; --brand2:#4d8a78; --soft:#e5efe9; --warm:#b8793a; --warmsoft:#f7ead8;
  --rose:#a8505a; --rosesoft:#f6e3e5; --blue:#3f6c8f; --bluesoft:#e2edf5;
  --shadow:0 6px 24px rgba(60,50,30,.08);
}
:root[data-theme="dark"]{
  --bg:#171b19; --card:#222926; --ink:#ece8de; --muted:#a39e91; --line:#38413d;
  --brand:#7cc2ad; --brand2:#5aa28d; --soft:#23332d; --warm:#e2a366; --warmsoft:#3a2f22;
  --rose:#e08c96; --rosesoft:#3b2528; --blue:#8fb9da; --bluesoft:#223140;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:16px;margin:0;color:var(--brand);letter-spacing:.04em;white-space:nowrap}
.top .sec{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.top .count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.stage{flex:1;position:relative;overflow:hidden;padding:18px 20px}
.slide{position:absolute;inset:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 36px;overflow-y:auto;opacity:0;pointer-events:none;transform:translateX(24px);transition:opacity .35s,transform .35s}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.out{transform:translateX(-24px)}
.slide h2{font-size:28px;margin:0 0 4px;color:var(--brand);line-height:1.35}
.slide .kicker{font-size:13px;letter-spacing:.14em;color:var(--warm);font-weight:600;margin-bottom:2px}
.slide .lead{color:var(--muted);margin:2px 0 18px;font-size:15.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr} .slide{padding:20px 18px;inset:10px} .stage{padding:10px} .top h1{font-size:14px}}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 6px;font-size:16px;color:var(--brand)}
.box p,.box ul{margin:4px 0;font-size:14.5px} .box ul{padding-left:20px}
.box.teal{background:var(--soft);border-color:transparent}
.box.warm{background:var(--warmsoft);border-color:transparent} .box.warm h3{color:var(--warm)}
.box.rose{background:var(--rosesoft);border-color:transparent} .box.rose h3{color:var(--rose)}
.box.blue{background:var(--bluesoft);border-color:transparent} .box.blue h3{color:var(--blue)}
.tag{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;margin-right:4px;font-weight:600;vertical-align:middle}
.t-h{background:var(--warmsoft);color:var(--warm)} .t-c{background:var(--bluesoft);color:var(--blue)} .t-m{background:var(--soft);color:var(--brand)} .t-x{background:var(--rosesoft);color:var(--rose)}
.exam{font-size:12px;background:var(--rosesoft);color:var(--rose);padding:1px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.src{font-size:12px;color:var(--muted);margin-top:14px}
.quote{border-left:4px solid var(--brand2);padding:6px 14px;margin:10px 0;color:var(--ink);background:var(--soft);border-radius:0 10px 10px 0;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--brand)}
.btn{background:var(--soft);border:1px solid transparent;color:var(--brand);padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--brand2)} .btn.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.panel{display:none} .panel.on{display:block}
.big{font-size:56px;line-height:1.1;margin:0;color:var(--brand);font-weight:800}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.cover .sub{font-size:20px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-size:13px;background:var(--bg);color:var(--muted)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line);background:var(--card)}
.bar .btn{min-width:44px}
.prog{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--brand2)}
.timer{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.timer i{display:block;height:100%;width:0;background:var(--warm)}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:13px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.drawer.on{display:block}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,92vw);background:var(--card);padding:18px;overflow-y:auto}
.drawer a{display:flex;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer}
.drawer a:hover,.drawer a.cur{background:var(--soft)}
.drawer a b{color:var(--brand);min-width:24px}
.wheel-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px}
.wheel{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:6px solid var(--line);background:var(--bg);font-weight:700;transition:.2s;padding:6px}
.wheel small{font-weight:400;color:var(--muted);font-size:12px}
.wheel.front{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.wheel.sel{transform:scale(1.05);box-shadow:var(--shadow)}
.car{width:100%;max-width:520px;height:auto}
.car .body{fill:var(--soft);stroke:var(--brand2);stroke-width:3}
.car .glass{fill:var(--bluesoft);stroke:var(--brand2);stroke-width:1.5}
.car .mid{font-size:17px;font-weight:700;fill:var(--brand)}
.car .midsub{font-size:11px;fill:var(--muted)}
.car .cap{font-size:12px;fill:var(--muted)}
.car .sw{cursor:pointer}
.car .sw rect{fill:#8a867b;stroke:var(--ink);stroke-width:3;transition:.2s}
.car .sw.front rect{fill:var(--brand);stroke:var(--brand)}
.car .sw text{font-size:17px;font-weight:700;fill:var(--ink)}
.car .sw text.s2{font-size:12px;font-weight:400;fill:var(--muted)}
.car .sw:hover rect,.car .sw.sel rect{stroke:var(--warm);stroke-width:5}
.flip{perspective:900px;height:210px;cursor:pointer}
.flip .f{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
.flip.on .f{transform:rotateY(180deg)}
.flip .s{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px 16px;overflow-y:auto;border:1px solid var(--line)}
.flip .fr{background:var(--soft);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.flip .fr b{font-size:18px;color:var(--brand)}
.flip .bk{background:var(--card);transform:rotateY(180deg);font-size:13.5px}
.flip .bk ul{margin:2px 0;padding-left:18px}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg)}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-weight:700;color:var(--brand);display:flex;justify-content:space-between;gap:10px}
.acc .bd{display:none;padding:0 16px 14px;font-size:14.5px}
.acc.on .bd{display:block} .acc .bd ul{padding-left:20px;margin:4px 0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.opt:hover{border-color:var(--brand2)}
.opt.ok{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.opt.no{background:var(--rosesoft);border-color:var(--rose);color:var(--rose)}
.sami label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--bg);cursor:pointer;font-size:14.5px}
.meter{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--brand2);width:0;transition:.3s}
.steps{display:flex;flex-direction:column;gap:8px}
.step{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;opacity:.35;transition:.3s;background:var(--bg)}
.step.on{opacity:1;border-style:solid;border-color:var(--brand2);background:var(--soft)}
.step b{color:var(--brand)}
.mm{width:100%;height:min(540px,calc(100dvh - 330px));min-height:300px}
.mm text{font-size:13px;fill:var(--ink);pointer-events:none}
.mm .nd rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.mm .nd.b rect{fill:var(--soft);stroke:var(--brand2);cursor:pointer}
.mm .nd.c rect{fill:var(--bg)}
.mm .nd.root rect{fill:var(--brand);stroke:none}
.mm .nd.root text{fill:#fff;font-weight:700;font-size:15px}
.mm .nd.b{cursor:pointer}
.mm line{stroke:var(--line);stroke-width:1.6}
.mm .kid{display:none} .mm .kid.on{display:block}
.keys{font-size:12px;color:var(--muted)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg);font-size:11.5px}
body.full .top,body.full .keys{display:none}
.hide-m{display:inline}
@media(max-width:860px){.hide-m{display:none}.big{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>現實治療 Reality Therapy</h1>
    <div class="sec" id="sec"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button class="btn" id="prev" title="上一頁 (←)">‹</button>
    <button class="btn" id="play" title="播放 / 暫停 (P)">▶ 播放</button>
    <button class="btn" id="next" title="下一頁 (→)">›</button>
    <div class="prog" id="prog"><i></i></div>
    <select id="spd" title="自動播放每頁停留秒數"><option value="15">15 秒</option><option value="25" selected>25 秒</option><option value="40">40 秒</option></select>
    <button class="btn" id="ov" title="目錄 (G)">目錄</button>
    <button class="btn" id="fs" title="全螢幕 (F)">⛶</button>
    <button class="btn" id="dk" title="深色 (D)">◐</button>
    <span class="keys hide-m"><kbd>←</kbd><kbd>→</kbd> 翻頁 <kbd>P</kbd> 播放 <kbd>G</kbd> 目錄</span>
  </div>
</div>
<div class="drawer" id="drawer"><div class="in" id="dlist"></div></div>

<script>
const H = '<span class="tag t-h">講義</span>', C = '<span class="tag t-c">Corey</span>', M = '<span class="tag t-m">我的整理</span>';
const X = t => `<span class="exam">${t}</span>`;
const li = a => '<ul>' + a.map(x => `<li>${x}</li>`).join('') + '</ul>';

/* ---------- 共用互動元件 ---------- */
function tabs(id, items){
  return `<div data-tabs="${id}"><div class="tabs">${items.map((t,i)=>`<button class="btn ${i?'':'on'}" data-tab="${i}">${t.k}</button>`).join('')}</div>${items.map((t,i)=>`<div class="panel ${i?'':'on'}" data-panel="${i}">${t.v}</div>`).join('')}</div>`;
}
function acc(items){
  return items.map(t=>`<div class="acc"><button>${t.k}<span>＋</span></button><div class="bd">${t.v}</div></div>`).join('');
}

/* ---------- 25 張投影片 ---------- */
const S = [];
const add = (sec, title, html) => S.push({sec, title, html});

// 1 封面
add('封面','封面',`
<div class="cover">
  <div class="kicker">COUNSELING THEORY ・ 輔導原理</div>
  <h2 class="big">現實治療<br>與選擇理論</h2>
  <p class="sub">Reality Therapy / Choice Theory</p>
  <p class="lead" style="max-width:640px">WDEP四個字母：把一條因果鏈變成一場對話：<b>需求沒被滿足，於是選擇了某種整體行為；行動與思考是我能直接改的部分，感受與生理會跟著變。</b></p>
  <div class="chips"><span class="chip">25 頁互動簡報</span><span class="chip">理論與框架</span><span class="chip">互動心智圖</span><span class="chip">Stan・Gwen 個案</span><span class="chip">考古題複習</span></div>
  <p class="src">按下方「▶ 播放」自動翻頁，或用 ← → 鍵手動翻頁。</p>
</div>`);

// 2 導覽
add('A 定位與脈絡','導覽與資料來源',`
<div class="kicker">A ・ 定位與脈絡</div><h2>怎麼用這個站</h2>
<p class="lead">資料來自兩本書。兩者說法不同處。</p>
<div class="grid g2">
  <div class="box warm"><h3>${H}教育家文教機構 樊蓉老師編授</h3><p>輔導原理 第十三章「現實治療」，頁 243-257。含歷屆名詞解釋、申論與選擇題。<b>考古題以此為主。</b></p></div>
  <div class="box blue"><h3>${C}《諮商與心理治療》第 11 章</h3><p>抉擇理論／現實治療，頁 372-406。含 Wubbolding 的 WDEP 實務、Stan 與 Gwen 個案、多元文化與限制。</p></div>
</div>
<h3 style="color:var(--brand);margin:20px 0 8px">版面導覽</h3>
<div class="grid g4">
  <div class="box"><h3>A 定位</h3><p>第 1-3 頁。Glasser 與三階段理論。</p></div>
  <div class="box"><h3>B 理論核心</h3><p>第 4-10 頁。需求、行為、3R、立場、因果鏈。</p></div>
  <div class="box"><h3>C 心智圖</h3><p>第 11-12 頁。互動圖與學派比較。</p></div>
  <div class="box"><h3>D 框架</h3><p>第 13-17 頁。關係、WDEP、SAMIC³、技術。</p></div>
  <div class="box"><h3>E 個案</h3><p>第 18-21 頁。Stan、Gwen、亞大案例題。</p></div>
  <div class="box"><h3>F 考古題</h3><p>第 22-25 頁。名詞卡、申論、測驗、易錯點。</p></div>
  <div class="box teal" style="grid-column:span 2"><h3>標籤說明</h3><p>${H}出自講義　${C}出自 Corey　${M}我的觀點或例答，非書中原文。</p></div>
</div>`);

// 3 Glasser 與三階段
add('A 定位與脈絡','Glasser 與三階段理論',`
<div class="kicker">A ・ 定位與脈絡</div><h2>從精神醫學到選擇理論</h2>
<p class="lead">William Glasser（1925-2013），美國精神科醫師。他反對自己受訓的醫療模式。</p>
<div class="grid g3">
  <div class="box"><h3>1970年 現實理論</h3><p>強調為自己的行為負責，治療法稱為 WDEP。</p></div>
  <div class="box"><h3>1980年 控制理論</h3><p>人為了控制外在世界來滿足內在需求，而控制自己的行為系統。</p></div>
  <div class="box"><h3>1990年 選擇理論</h3><p>行為是選擇，我們唯一能控制的是自己。「We are our choice」。</p></div>
</div>
<div class="grid g2" style="margin-top:14px">
  <div class="box teal"><h3>生平里程碑 ${H}</h3>${li(['1925 生於美國 Ohio 克里夫蘭市','1953 創設現實治療機構（Institute of Reality Therapy）','1965《現實治療：精神醫學的新取向》','《認同社會》（控制理論相關）、《沒有失敗的學校》（校園應用，1990 Quality School）'])}</div>
  <div class="box blue"><h3>兩者關係 ${C}</h3><p><b>選擇理論是理論基礎，現實治療是實務工具。</b>Wubbolding 的比喻：選擇理論是高速公路，現實治療是在路上運送物品的車輛。</p><p>後續由 Robert Wubbolding 以 WDEP 系統大幅推廣。</p></div>
</div>
<p class="src">${X('考點')} 「由控制理論轉變為選擇理論」為正確敘述（交大103）；發展順序是 現實理論 → 控制理論 → 選擇理論。</p>`);

// 4 需求兩說並陳
add('B 理論核心','人性觀：需求兩說並陳',`
<div class="kicker">B ・ 理論核心</div><h2>人性觀：我們被需求驅動</h2>
<p class="lead">講義與 Corey 的「基本需求」</p>
${tabs('need',[
{k:'講義說法',v:`<div class="grid g2"><div class="box warm"><h3>${H}p.243 兩類最基本需求</h3>${li(['愛人與被愛的需求','自我價值與被接納的需求'])}</div>
<div class="box warm"><h3>${H}p.244 控制理論下的 5 項</h3>${li(['四大心理需求：<b>隸屬、權力、自由、玩樂</b>','加上生理需求：<b>生存</b>（生理性、食物）','與 Maslow 對照：Glasser 說「我只有愛，沒有錢」'])}</div></div>
<div class="quote">手寫筆記：需求未被滿足時人感到痛苦；用負責任的方式滿足，才能建立成功認同。</div>`},
{k:'Corey 說法',v:`<div class="grid g2"><div class="box blue"><h3>${C}p.375 五個編入遺傳的需求碼</h3>${li(['<b>生存</b>（自我保存）','<b>愛與隸屬</b>','<b>權力</b>（內在控制）','<b>自由獨立</b>','<b>快樂安寧</b>'])}<p>每人五種都有，程度不同。</p></div>
<div class="box blue"><h3>${C}關鍵補充</h3>${li(['愛與隸屬最基本，也最難被滿足','Wubbolding 另提<b>第六需求：意義與目的</b>（Frankl）','需求是遺傳的，驅動我們所有的生活'])}</div></div>`},
{k:'並陳對照',v:`<table><tr><th>面向</th><th>講義</th><th>Corey</th></tr>
<tr><td>數量</td><td>心理 4 + 生理 1 = 5 項</td><td>5 項（另有第六需求）</td></tr>
<tr><td>用詞</td><td>隸屬、權力、自由、玩樂、生存</td><td>愛與隸屬、權力、自由獨立、快樂安寧、生存</td></tr>
<tr><td>共通</td><td colspan="2">五項核心一致。差別只在名稱與第六需求。</td></tr></table>
<div class="box rose" style="margin-top:12px"><h3>${X('陷阱')} 權利 ≠ 權力</h3><p>中教106：「下列何者並非 Glasser 所提出的需求」，答案是選項中的「<b>權利</b>」。Glasser 的是「權<b>力</b>」(power)。</p></div>
${M} 答題策略：寫論述題時，先寫「五大需求」，再括號補充別種說法，兩套都不會被扣分。`}])}`);

// 5 優質世界
add('B 理論核心','優質世界與相簿',`
<div class="kicker">B ・ 理論核心</div><h2>優質世界：每個人心中的香格里拉</h2>

add('D 治療框架','WDEP 系統',`
<div class="kicker">D ・ 治療框架</div><h2>WDEP：把原理變成會談的節奏</h2>
<p class="lead">${X('屏大103/106・東吳110・政大111')} 歷屆最熱門。點選字母看各步驟的問句與範例。</p>

<div class="box"><h3>範例問句</h3>${li(['「當你隔離在家，你覺得如何？」','「當你隔離在家、感到焦慮時，你的身體有什麼地方跟著改變了？」（政大111）','「昨天確實做了什麼？」「上個禮拜有做些什麼不一樣的呢？」'])}</div></div>`},
{k:'E 評估',v:`<div class="grid g2"><div class="box teal"><h3>Evaluation（self-evaluation）</h3><p>${H}自我評估及價值判斷。${C}<b>現實治療的基石</b>，也是行為改變的正途；「個人不會改變，除非先確定改變會有更多益處」。</p></div>
<div class="box"><h3>範例問句</h3>${li(['「你正在做的對你是有幫助或是傷害呢？」','「你目前所做的是否是你真正想要做的？」','「這是否有助於你以這樣的方式來看待？」','「現在每天在家、遠離人群，是否能有正常社交生活？」（政大111）'])}</div></div>

<div class="box"><h3>範例問句</h3>${li(['「你打算什麼時候開始執行？每次大概會通話幾分鐘？」（政大111）','「今天你願意開始為改變生活做些什麼？」','「如果你的外在環境都沒有改變，你會做些什麼不一樣的事情？」'])}</div></div>

      <label><input type="checkbox"><span><b>C</b> 持續去做 Continuously / Consistently done：可重複每日實踐</span></label>

// 17 技術箱
add('D 治療框架','技術箱',`
<div class="kicker">D ・ 治療框架</div><h2>現實治療的技術工具箱</h2>
<p class="lead">${H}p.246-247。手寫提示：可與阿德勒（敢於拒絕？）、Frankl 減反省法、REBT 對照。</p>
<div class="grid g3">
  <div class="box"><h3>角色扮演</h3><p>練習新行為，預演現實中的對話。</p></div>
  <div class="box rose"><h3>語言震驚法（矛盾法）${X('師大・屏大 5%')}</h3><p>使當事人受到震懾或以適當譏諷面對不合現實的行為，使其能負起責任。例：「這真是個最笨的行為！我可以看見它將帶來……的後果。」</p></div>
  <div class="box"><h3>面質（對立技術）</h3><p>不允許任何藉口。對應歷程原則「不接受藉口」。</p></div>
  <div class="box teal"><h3>積極性技術</h3><p>以積極擬訂計畫取代探索當事人的挫折與失敗。</p></div>
  <div class="box"><h3>跟進（Pinning down）</h3><p>緊盯計畫目標的細節：諮商師問得愈清楚，達成可能性愈大。</p></div>
  <div class="box"><h3>控制知覺</h3><p>用控制理論改變行為；以「冥想」改變知覺以降低需求與知覺的不一致。積極成癮策略：冥想、跑步、超覺冥想、生理回饋、視覺想像、吟唱、徒步旅行。</p></div>
  <div class="box blue" style="grid-column:span 3"><h3>建設性辯論（Constructive Debate）</h3><p>為了拓展當事人自我觀念，期望在爭辯中使當事人發現事物的價值與意義。（手寫提示：可對照 REBT 的駁斥，兩者形式相近，但現實治療重點仍在「這樣有用嗎」。）</p></div>
</div>
<div class="box warm" style="margin-top:12px"><h3>${M}矛盾策略的使用提醒</h3><p>語言震驚用在「已建立關係」且「當事人能懂幽默」的時機；關係沒建好就用，容易變成批評，違反治療者避免行為。Corey 也提醒要避免貶損、責罵與挑毛病。</p></div>`);

add('E 個案概念化','Stan 個案：概念化',`
<div class="kicker">E ・ 個案概念化</div><h2>Stan：一直當受害者的人</h2>
<p class="lead">${C}p.398-400。Stan 一直無法有效得到需求中最關鍵的一項：<b>一個滿意的關係</b>。</p>

  <div class="box teal"><h3>現實治療的定位</h3><p>用選擇理論確認行為動機，提供工作方向，教導他如何以<b>更好的選擇</b>得到他所要的。</p></div>

</div>

add('E 個案概念化','Stan 個案：治療歷程',`
<div class="kicker">E ・ 個案概念化</div><h2>Stan：現實治療者怎麼做</h2>
<p class="lead">${C}p.399-400。把書中的做法對應回 WDEP。</p>
${tabs('stan',[
{k:'關係先行',v:`<div class="quote">與 Stan 建立關係之後，我讓他看到<b>除非他選擇當過去的受害者，否則他不會是受害者</b>。</div><p>${C}治療者確定他已充分重溫過去痛苦，進行下去。無法改變童年，但他對過去經驗與現在處境的影響作用，已能用不同的視框了解。最後，他理解到<b>無法控制別人，卻可以控制他目前要做的</b>。</p>`},
{k:'W 想要',v:`<div class="quote">我要求 Stan 描述：假如他的症狀都消失了，那麼生活會有什麼不同？</div><p>${C}他想成為諮商員的樣子、與人見面時表現出信心、將自己視為一個有價值的人，以及享受生活。（這些就是他優質世界裡的圖像）</p>`},
{k:'D 行動',v:`<p>${C}向他解說完整行為由行動、思考、感受及生理組成。Stan 雖然很討厭大部分時間感受到焦慮，仍學到：<b>很多他正在做和正在想的，正是直接造成他不想要的感受和生理反應的原因</b>。</p><div class="quote">我更有興趣的是他「正在做的」和「正在想的」是什麼，因為這些是可以直接改變的行為成分。</div><p>治療者幫 Stan 了解<b>憂鬱是他選擇的一部分</b>。</p>`},
{k:'E 評估',v:`<div class="quote">「現在選擇去做的，是不是可以讓你得到所要的？」</div><p>${C}當 Stan 退步時，治療者看見他做出<b>與之前不一樣的行動</b>時就是最好的行動，並幫他了解，他有力量去改變。評估許多他正在做的事沒有辦法實現這些圖像。</p>`},
{k:'P 計畫',v:`<p>${C}他決定願意對自己做一些不同的工作時，諮商中大部分的時間用來<b>計畫及討論計畫的實踐</b>。焦點放在他現在可以做的事，以達到所要的改變步驟。</p><ul><li>Stan 持續實踐計畫，逐漸有成功的經驗</li><li>沒有顯著進步時，一起好好修正原計畫，並讓他知道<b>治療者不會放棄他</b></li><li>鼓勵閱讀刺激思考的書，把所學帶入諮商</li><li>教導選擇理論及 WDEP 系統，最後 Stan 逐漸接受「他是唯一可以控制自己行為的人」</li></ul>`}])}
<p class="src">${M} 注意：這個個案示範了 W 與 D 的順序可以來回，並非直線。手寫提醒的陷阱：不要把「他很憂鬱」當成治療目標。</p>`);

add('E 個案概念化','Gwen 個案：對話標註',`

const stage = document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<section class="slide" data-i="${i}" aria-label="${s.title}">${s.html}</section>`).join('');
const slides = [...stage.querySelectorAll('.slide')];
const $ = id => document.getElementById(id);
let cur = 0, playing = false, timer = null;

function go(n, dir){
  n = Math.max(0, Math.min(S.length-1, n));
  slides.forEach((el,i)=>{ el.classList.toggle('on', i===n); el.classList.toggle('out', i<n); if(i===n) el.scrollTop=0; });
  cur = n;
  $('sec').textContent = S[n].sec + '・' + S[n].title;
  $('count').textContent = (n+1) + ' / ' + S.length;
  $('prog').firstElementChild.style.width = ((n+1)/S.length*100) + '%';
  document.querySelectorAll('#dlist a').forEach((a,i)=>a.classList.toggle('cur', i===n));
  try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
  if(playing) schedule();
}
function schedule(){
  clearTimeout(timer);
  const sec = +$('spd').value;
  if(cur >= S.length-1){ stop(); return; }
  timer = setTimeout(()=>go(cur+1), sec*1000);
}
function start(){ playing = true; $('play').textContent = '❚❚ 暫停'; $('play').classList.add('on'); if(cur>=S.length-1) go(0); else schedule(); }
function stop(){ playing = false; clearTimeout(timer); $('play').textContent = '▶ 播放'; $('play').classList.remove('on'); }
$('play').onclick = () => playing ? stop() : start();
$('next').onclick = () => go(cur+1);
$('prev').onclick = () => go(cur-1);
$('spd').onchange = () => { if(playing) schedule(); };
$('ov').onclick = () => $('drawer').classList.add('on');
$('drawer').onclick = e => { if(e.target.id==='drawer') $('drawer').classList.remove('on'); };
$('dlist').innerHTML = '<h3 style="margin:0 0 8px;color:var(--brand)">目錄</h3>' + S.map((s,i)=>`<a data-g="${i}"><b>${i+1}</b><span>${s.title}<br><small style="color:var(--muted)">${s.sec}</small></span></a>`).join('');
$('dlist').onclick = e => { const a = e.target.closest('a'); if(a){ go(+a.dataset.g); $('drawer').classList.remove('on'); } };
$('dk').onclick = () => {
  const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = d; try{ localStorage.setItem('rt-theme', d); }catch(e){}
};
try{ const t = localStorage.getItem('rt-theme'); if(t) document.documentElement.dataset.theme = t; else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme='dark'; }catch(e){}
$('fs').onclick = () => {
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.().catch(()=>{}); document.body.classList.add('full'); }
  else { document.exitFullscreen?.(); }
};
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement) document.body.classList.remove('full'); });
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT') return;
  if(e.key==='ArrowRight'||e.key==='PageDown') go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
  else if(e.key==='Home') go(0); else if(e.key==='End') go(S.length-1);
  else if(e.key==='p'||e.key==='P') $('play').click();
  else if(e.key==='g'||e.key==='G') $('drawer').classList.toggle('on');
  else if(e.key==='f'||e.key==='F') $('fs').click();
  else if(e.key==='d'||e.key==='D') $('dk').click();
  else if(e.key==='Escape') $('drawer').classList.remove('on');
});

let qa = {};
function renderQuiz(){
  $('quiz').innerHTML = Q.map((q,i)=>`<div style="margin-bottom:14px"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>{
    let cls=''; if(qa[i]!==undefined){ if(j===q[2]) cls='ok'; else if(j===qa[i]) cls='no'; }
    return `<button class="opt ${cls}" data-q="${i}" data-o="${j}">(${String.fromCharCode(65+j)}) ${o}</button>`; }).join('')}${qa[i]!==undefined?`<div class="src">${qa[i]===q[2]?'答對。':'答錯。'}${q[3]}</div>`:''}</div>`).join('');
  const done = Object.keys(qa).length, right = Object.keys(qa).filter(i=>qa[i]===Q[i][2]).length;
  $('qbar').style.width = (done/Q.length*100)+'%';
  $('qscore').textContent = done ? `${right} / ${done} 題答對（共 ${Q.length} 題）` : '尚未作答';
  const wrong = Object.keys(qa).filter(i=>qa[i]!==Q[i][2]);
  $('qwrong').innerHTML = wrong.length ? wrong.map(i=>`<p>${+i+1}. ${Q[i][3]}</p>`).join('') : '還沒有錯題。';
}
$('quiz').addEventListener('click', e => {
  const b = e.target.closest('[data-q]'); if(!b || qa[b.dataset.q]!==undefined) return;
  qa[b.dataset.q] = +b.dataset.o; const y = $('quiz').parentElement.scrollTop; renderQuiz();
});
$('qreset').onclick = () => { qa = {}; renderQuiz(); };

// 心智圖
const MM = [
 ['理論源起',['現實理論 1970','控制理論 1980','選擇理論 1990','Glasser 1925-2013']],
 ['人性觀',['五大需求','優質世界','知覺','行為有目的']],
 ['整體行為',['行動（前輪）','思考（前輪）','感受（後輪）','生理（後輪）']],
 ['核心主張',['3R','成功認同','責任不是責備','只能控制自己']],
 ['治療歷程',['投入關係','W 想要','D 行動','E 評估','P 計畫']],
 ['技術與應用',['矛盾法','面質','積極性技術','跟進','學校與團體']]
];
(function(){
  const svg = $('mm'), cx = 480, cy = 280, NS = 'http://www.w3.org/2000/svg';
  const el = (n, a={}, p=svg) => { const e = document.createElementNS(NS, n); for(const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const node = (x, y, t, cls, p) => {
    const g = el('g', {class:'nd '+cls}, p), w = Math.max(70, t.length*14+22), h = cls==='root'?46:32;
    el('rect', {x:x-w/2, y:y-h/2, width:w, height:h, rx:h/2}, g);
    const tx = el('text', {x, y:y+5, 'text-anchor':'middle'}, g); tx.textContent = t; return g;
  };
  const lines = el('g'), kids = [];
  const n = MM.length;
  MM.forEach((b,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n, bx = cx + Math.cos(a)*190, by = cy + Math.sin(a)*165;
    el('line', {x1:cx, y1:cy, x2:bx, y2:by}, lines);
    const kg = el('g', {class:'kid'}), spread = b[1].length;
    b[1].forEach((c,j)=>{
      const off = (j-(spread-1)/2)*0.34, ka = a + off, kx = cx + Math.cos(ka)*355, ky = cy + Math.sin(ka)*250;
      el('line', {x1:bx, y1:by, x2:Math.max(90,Math.min(870,kx)), y2:Math.max(24,Math.min(536,ky))}, kg);
      node(Math.max(90,Math.min(870,kx)), Math.max(24,Math.min(536,ky)), c, 'c', kg);
    });
    kids.push(kg);
    const g = node(bx, by, b[0], 'b', svg);
    g.addEventListener('click', () => kg.classList.toggle('on'));
  });
  svg.insertBefore(lines, svg.firstChild);
  kids.forEach(k=>svg.insertBefore(k, svg.children[1]));
  node(cx, cy, '現實治療', 'root', svg);
  $('mmAll').onclick = () => kids.forEach(k=>k.classList.add('on'));
  $('mmNone').onclick = () => kids.forEach(k=>k.classList.remove('on'));
  kids[1].classList.add('on');
})();

go(Math.max(0, Math.min(S.length-1, (parseInt(location.hash.slice(1))||1)-1)));
